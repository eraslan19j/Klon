name: ROM camera inventory

on:
  push:
    branches:
      - arena/944eb079-klon
    paths:
      - .github/workflows/rom-camera-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Analyze RODIN OS3.0.305 CN camera APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out all ROM LFS parts
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install image and APK inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt erofs-utils e2fsprogs xz-utils
          go install github.com/ssut/payload-dumper-go@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Reassemble, verify, enumerate payload, and inspect all camera APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          ROM_DIR="$GITHUB_WORKSPACE/RODIN_OS3.0.305_CN"
          WORK="$RUNNER_TEMP/rodin-camera-scan"
          ROM="$WORK/rodin-ota_full-OS3.0.305.0.WOJCNXM-user-16.0-d97c4c15e4.zip"
          OUT="$WORK/out"
          EXTRACTED="$WORK/extracted"
          REPORT="$WORK/camera-report.txt"
          mkdir -p "$WORK" "$OUT" "$EXTRACTED"

          {
            echo "RODIN OS3.0.305 CN — recovery-ROM camera inventory"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "== LFS source parts (strict assembly order) =="
            for suffix in aa ab ac ad; do
              part="$ROM_DIR/rodin-OS3.0.305-CN.part-$suffix"
              printf '%s  ' "$(sha256sum "$part")"
            done
            echo
          } > "$REPORT"

          cat "$ROM_DIR/rodin-OS3.0.305-CN.part-aa" \
              "$ROM_DIR/rodin-OS3.0.305-CN.part-ab" \
              "$ROM_DIR/rodin-OS3.0.305-CN.part-ac" \
              "$ROM_DIR/rodin-OS3.0.305-CN.part-ad" > "$ROM"

          actual_md5="$(md5sum "$ROM" | awk '{print $1}')"
          expected_md5="$(awk '{print $1}' "$ROM_DIR/ORIGINAL_MD5.txt")"
          {
            echo "== Reassembled recovery ZIP =="
            echo "Path: $ROM"
            echo "Size: $(stat -c%s "$ROM") bytes"
            echo "MD5:  $actual_md5"
            echo "Expected MD5: $expected_md5"
            if [[ "$actual_md5" == "$expected_md5" ]]; then
              echo "Integrity: VERIFIED"
            else
              echo "Integrity: FAILED"
              exit 1
            fi
            echo
            echo "== Top-level ZIP entries =="
            unzip -Z1 "$ROM" | sed -n '1,300p'
            echo
            echo "== Complete payload partition manifest =="
          } >> "$REPORT"

          payload-dumper-go -l "$ROM" 2>&1 | tee "$WORK/payload-partitions.txt" >> "$REPORT"
          echo >> "$REPORT"

          selected=()
          for partition in system product system_ext vendor odm; do
            if grep -Eq "(^|[[:space:],])${partition}[[:space:]]*\\(" "$WORK/payload-partitions.txt"; then
              selected+=("$partition")
            fi
          done
          if ((${#selected[@]} == 0)); then
            echo "No requested Android mount partitions were found in the payload." | tee -a "$REPORT"
            exit 1
          fi
          joined=$(IFS=,; echo "${selected[*]}")
          {
            echo "== Extracted Android mount partitions =="
            echo "Requested: system, product, system_ext, vendor, odm"
            echo "Present and extracted: $joined"
            for partition in system product system_ext vendor odm; do
              if [[ ! " ${selected[*]} " =~ " $partition " ]]; then
                echo "Not present in payload: $partition"
              fi
            done
            echo
          } >> "$REPORT"

          # The dumper opens the recovery ZIP directly, so payload.bin is not copied out.
          payload-dumper-go -q -c 8 -p "$joined" -o "$OUT" "$ROM"

          {
            echo "== Filesystem extraction =="
          } >> "$REPORT"
          for image in "$OUT"/*.img; do
            partition="$(basename "$image" .img)"
            target="$EXTRACTED/$partition"
            mkdir -p "$target"
            image_type="$(file -b "$image")"
            printf '%s: %s\n' "$partition.img" "$image_type" | tee -a "$REPORT"
            if fsck.erofs --extract="$target" "$image" >/dev/null 2>"$WORK/${partition}.erofs.err"; then
              echo "  extractor: EROFS" >> "$REPORT"
            elif debugfs -R "rdump / $target" "$image" >/dev/null 2>"$WORK/${partition}.ext4.err"; then
              echo "  extractor: ext4" >> "$REPORT"
            else
              echo "  extractor: FAILED (image retained for raw inspection)" >> "$REPORT"
              cat "$WORK/${partition}.erofs.err" "$WORK/${partition}.ext4.err" 2>/dev/null | tail -20 >> "$REPORT" || true
            fi
          done
          echo >> "$REPORT"

          : > "$WORK/all-apks.tsv"
          for partition in "${selected[@]}"; do
            root="$EXTRACTED/$partition"
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' apk; do
              relative="${apk#"$root"/}"
              # A partition image contains its mount root. Prefix it to produce the
              # path Android uses after logical partitions are mounted.
              android_path="/$partition/$relative"
              badging="$(aapt dump badging "$apk" 2>/dev/null | grep '^package:' | head -1 || true)"
              package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")"
              version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"$badging")"
              version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"$badging")"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$partition" "$android_path" "$apk" "$package" "$version_name" "$version_code" >> "$WORK/all-apks.tsv"
            done < <(find "$root" -type f -iname '*.apk' -print0)
          done

          {
            echo "== Full APK inventory summary =="
            echo "Total APK files discovered in requested mount partitions: $(wc -l < "$WORK/all-apks.tsv")"
            echo
            echo "== Camera APK matches =="
          } >> "$REPORT"

          : > "$WORK/camera-apks.tsv"
          while IFS=$'\t' read -r partition android_path apk package version_name version_code; do
            base="$(basename "$apk")"
            lower_base="${base,,}"
            lower_package="${package,,}"
            if [[ "$lower_base" == *camera*.apk || "$lower_package" == *camera* || "$package" == "com.android.camera" ]]; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$partition" "$android_path" "$apk" "$package" "$version_name" "$version_code" >> "$WORK/camera-apks.tsv"
            fi
          done < "$WORK/all-apks.tsv"

          if [[ ! -s "$WORK/camera-apks.tsv" ]]; then
            echo "No filename/package camera APK match was found." >> "$REPORT"
          else
            while IFS=$'\t' read -r partition android_path apk package version_name version_code; do
              {
                echo "Partition: $partition"
                echo "Android path: $android_path"
                echo "Package: ${package:-<aapt unavailable>}"
                echo "versionName: ${version_name:-<not declared/resolved>}"
                echo "versionCode: ${version_code:-<not declared/resolved>}"
                echo "aapt: $(aapt dump badging "$apk" 2>/dev/null | grep '^package:' | head -1 || true)"
                echo "SHA-256: $(sha256sum "$apk" | awk '{print $1}')"
                echo "APK size: $(stat -c%s "$apk") bytes"
                echo "Feature-string evidence (APK classes/resources/native libraries):"
              } >> "$REPORT"
              strings_file="$WORK/$(basename "$apk").strings"
              # APK entries are compressed; unzip -p gives strings a uniform view of
              # DEX, resources and embedded native libraries without extracting APKs.
              unzip -p "$apk" 2>/dev/null | strings -a -n 4 > "$strings_file" || true
              for feature in Legendary Leica 'CV Lens' MiVi; do
                case "$feature" in
                  Legendary) regex='legendary' ;;
                  Leica) regex='leica' ;;
                  'CV Lens') regex='cv[ _.-]*lens' ;;
                  MiVi) regex='mivi' ;;
                esac
                hits="$(grep -iE "$regex" "$strings_file" | sort -u | head -20 || true)"
                if [[ -n "$hits" ]]; then
                  echo "  $feature: PRESENT" >> "$REPORT"
                  sed 's/^/    /' <<<"$hits" >> "$REPORT"
                else
                  echo "  $feature: NOT FOUND" >> "$REPORT"
                fi
              done
              echo >> "$REPORT"
            done < "$WORK/camera-apks.tsv"
          fi

          {
            echo "== Direct requested-name checks =="
            for requested in MiuiCamera.apk MiCamera.apk; do
              matches="$(find "$EXTRACTED" -type f -name "$requested" -printf '%p\n' | sed "s#^$EXTRACTED/##" || true)"
              if [[ -n "$matches" ]]; then
                echo "$requested:"
                sed 's#^#  /#; s#/#/#' <<<"$matches"
              else
                echo "$requested: not found"
              fi
            done
            echo "com.android.camera manifest package:"
            awk -F '\t' '$4 == "com.android.camera" {print "  " $2}' "$WORK/all-apks.tsv" || true
            echo
            echo "== Feature-name file hits across extracted target partitions =="
            find "$EXTRACTED" -type f \( -iname '*legendary*' -o -iname '*leica*' -o -iname '*cv*lens*' -o -iname '*mivi*' \) -printf '/%P\n' | sort | head -200 || true
          } >> "$REPORT"

          cp "$REPORT" "$GITHUB_WORKSPACE/rom-camera-report.txt"
          {
            echo '## ROM camera inventory'
            echo
            echo 'The full report is uploaded as an artifact and committed workspace file for this run.'
            echo
            echo '```text'
            sed -n '1,500p' "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT"

      - name: Upload camera report
        uses: actions/upload-artifact@v4
        with:
          name: rodin-os3.0.305-cn-camera-report
          path: rom-camera-report.txt
          if-no-files-found: error
          retention-days: 7
