name: Export RODIN OS3.0.305 APK inventory

on:
  push:
    branches:
      - arena/944eb079-klon
    paths:
      - .github/workflows/export-rodin-apks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Extract and LFS-publish every RODIN APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out ROM LFS source parts
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install OTA and EROFS inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils xz-utils curl
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/payload-dumper-go.tar.gz" \
            https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/payload-dumper-go.tar.gz" -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/payload-dumper-go"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Reassemble ROM and extract every APK unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          ROM_DIR="$GITHUB_WORKSPACE/RODIN_OS3.0.305_CN"
          WORK="$RUNNER_TEMP/rodin-apk-export"
          ROM="$WORK/rodin-ota_full-OS3.0.305.0.WOJCNXM-user-16.0-d97c4c15e4.zip"
          IMAGES="$WORK/images"
          EXTRACTED="$WORK/extracted"
          EXPORT_ROOT="$GITHUB_WORKSPACE/RODIN_OS3.0.305_APKS"
          INDEX="$EXPORT_ROOT/APK_INDEX.txt"
          mkdir -p "$WORK" "$IMAGES" "$EXTRACTED"

          # Mandatory byte order: aa -> ab -> ac -> ad.
          cat "$ROM_DIR/rodin-OS3.0.305-CN.part-aa" \
              "$ROM_DIR/rodin-OS3.0.305-CN.part-ab" \
              "$ROM_DIR/rodin-OS3.0.305-CN.part-ac" \
              "$ROM_DIR/rodin-OS3.0.305-CN.part-ad" > "$ROM"
          expected_md5="$(awk '{print $1}' "$ROM_DIR/ORIGINAL_MD5.txt")"
          actual_md5="$(md5sum "$ROM" | awk '{print $1}')"
          [[ "$actual_md5" == "$expected_md5" ]]
          echo "Verified recovery ZIP MD5: $actual_md5"

          # These are all present in this full OTA's manifest.  The package dumper
          # reads payload.bin directly from the verified recovery ZIP.
          payload-dumper-go -q -c 8 -p system,product,system_ext,vendor,odm -o "$IMAGES" "$ROM"

          for image in "$IMAGES"/*.img; do
            partition="$(basename "$image" .img)"
            mkdir -p "$EXTRACTED/$partition"
            fsck.erofs --extract="$EXTRACTED/$partition" "$image" >/dev/null
          done

          rm -rf "$EXPORT_ROOT"
          mkdir -p "$EXPORT_ROOT"/{system,product,system_ext,vendor,odm}
          tmp_index="$WORK/APK_INDEX.unsorted.txt"
          : > "$tmp_index"

          source_count=0
          for partition in system product system_ext vendor odm; do
            source_root="$EXTRACTED/$partition"
            destination_root="$EXPORT_ROOT/$partition"
            while IFS= read -r -d '' source_apk; do
              relative_path="${source_apk#"$source_root"/}"
              destination_apk="$destination_root/$relative_path"
              mkdir -p "$(dirname "$destination_apk")"
              # cp is deliberately used without archive rewriting or APK tooling;
              # the destination bytes are immediately checked against the source.
              cp "$source_apk" "$destination_apk"
              source_sha256="$(sha256sum "$source_apk" | awk '{print $1}')"
              destination_sha256="$(sha256sum "$destination_apk" | awk '{print $1}')"
              [[ "$source_sha256" == "$destination_sha256" ]]
              source_android_path="/$partition/$relative_path"
              exported_repo_path="RODIN_OS3.0.305_APKS/$partition/$relative_path"
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$partition" "$source_android_path" "$source_sha256" "$exported_repo_path" "$(stat -c%s "$source_apk")" >> "$tmp_index"
              ((++source_count))
            done < <(find "$source_root" -type f -iname '*.apk' -print0 | sort -z)
          done

          destination_count="$(find "$EXPORT_ROOT" -type f -iname '*.apk' | wc -l)"
          [[ "$source_count" -eq "$destination_count" ]]
          [[ "$source_count" -eq 383 ]]
          {
            echo '# RODIN OS3.0.305 CN APK index'
            echo '# Source: verified reassembly of aa -> ab -> ac -> ad'
            echo "# Recovery ZIP MD5: $actual_md5"
            echo "# APK count: $source_count"
            echo '# Columns: partition<TAB>source_android_path<TAB>sha256<TAB>exported_repo_path<TAB>size_bytes'
            sort -t $'\t' -k1,1 -k2,2 "$tmp_index"
          } > "$INDEX"

          echo "Exported unchanged APK files: $destination_count"
          sha256sum "$INDEX"
          find "$EXPORT_ROOT" -maxdepth 1 -type d -printf '%f\n' | sort

      - name: LFS-track, commit, and push APK export
        shell: bash
        run: |
          set -Eeuo pipefail
          git lfs install --local
          git lfs track 'RODIN_OS3.0.305_APKS/**/*.apk'
          git add .gitattributes RODIN_OS3.0.305_APKS
          expected=383
          staged_apks="$(git diff --cached --name-only | grep -Ec '^RODIN_OS3\.0\.305_APKS/.*\.apk$')"
          [[ "$staged_apks" -eq "$expected" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add RODIN OS3.0.305 APK inventory'
          git push
          echo "Commit: $(git rev-parse HEAD)"
          echo "LFS APK pointers: $(git lfs ls-files | grep -c 'RODIN_OS3.0.305_APKS/' || true)"

      - name: Publish export summary
        shell: bash
        run: |
          {
            echo '## RODIN OS3.0.305 APK export'
            echo
            echo '- **APK count:** 383'
            echo '- **Root:** `RODIN_OS3.0.305_APKS/`'
            echo '- **Index:** `RODIN_OS3.0.305_APKS/APK_INDEX.txt`'
            echo "- **Commit:** \`$(git rev-parse HEAD)\`"
            echo '- **LFS tracked:** all exported `*.apk` files'
          } >> "$GITHUB_STEP_SUMMARY"
